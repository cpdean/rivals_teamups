<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Rivals Teamups</title><style>:root{--bg:#f7f7f9;--fg:#1c1c22;--muted:#6a6a78;--card:#ffffff;--line:#e2e2ea;--accent:#5b5bd6;--chip:#eeeef4;--warn:#b45309;--edge:#a6a6bd}@media(prefers-color-scheme:dark){:root{--bg:#141419;--fg:#e8e8ef;--muted:#9a9aa8;--card:#1d1d25;--line:#2c2c37;--accent:#9a9aff;--chip:#26262f;--warn:#fbbf24;--edge:#5c5c74}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 '-apple-system',BlinkMacSystemFont,segoe ui,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}h1{font-size:16px;margin:0;font-weight:600}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 10px}button:hover{border-color:var(--accent)}.rolebar{display:flex;gap:6px;align-items:center}.rolebar .rf{font-size:12px;padding:4px 11px;border-radius:999px}.rolebar .rf.active{border-color:var(--accent);color:var(--accent);font-weight:600}.rosterhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rosterhead .rolebar{margin-left:auto}main{max-width:1100px;margin:0 auto;padding:20px}.hint{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}.yoursquad{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;min-height:46px}.yoursquad .empty{color:var(--muted);font-style:italic;align-self:center}.squad-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:22px}.skillpanel{margin-bottom:22px}.skillpanel .skill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13.5px}.skillpanel .empty{color:var(--muted);font-style:italic}.comp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}svg.tree .edge{stroke:var(--edge);stroke-width:2}svg.tree .box{stroke:transparent;stroke-width:2}svg.tree .imgbox{fill:none}svg.tree image{pointer-events:none}svg.tree .node.member .box{stroke:#ffd400;stroke-width:4}svg.tree text.ini{fill:#fff;font-size:12px;font-weight:700}svg.tree text.lbl{fill:var(--fg);font-size:10px}svg.tree .node{cursor:pointer}.box.r-tank{fill:#2f6fed}.box.r-dps{fill:#e0562d}.box.r-heal{fill:#12a56b}.box.r-none{fill:#7a7a86}h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 10px}.grid{display:flex;flex-wrap:wrap;gap:7px}.tile{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;user-select:none;position:relative}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile:hover{outline:2px solid var(--accent)}.tile.in-squad{outline:3px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}.tile.in-squad::after{content:"✓";position:absolute;top:-2px;right:1px;font-size:11px;color:var(--accent);background:var(--bg);border-radius:50%;line-height:1}.tile.unreleased{border-style:dashed;opacity:.65}.tile.r-tank{background:#2f6fed}.tile.r-dps{background:#e0562d}.tile.r-heal{background:#12a56b}.tile.r-none{background:#7a7a86}.meta{color:var(--muted);font-size:12px;margin-top:8px}</style><header><h1>Rivals Teamups <small id=ver style=color:var(--muted);font-weight:400></small></h1><button id=clear>clear squad</button></header><main><h2 class=sec>your squad</h2><div id=yoursquad class=yoursquad></div><div id=hint class=hint>pick heroes below to add them to your strike squad — each shows its immediate
team-up partners, and overlapping squads merge into one network.</div><div id=squad class=squad-wrap></div><div id=skillpanel class=skillpanel></div><div class=rosterhead><h2 class=sec>roster — click to toggle squad membership</h2><div class=rolebar id=rolebar><button class="rf active" data-role=all>all</button>
<button class=rf data-role=tank>tank</button>
<button class=rf data-role=heal>healer</button>
<button class=rf data-role=dps>dps</button></div></div><div id=grid class=grid></div><div class=meta id=meta></div></main><script>const DATA={heroes:[{id:"jubilee",name:"Jubilee",role:"heal",released:!0,icon:!0},{id:"cyclops",name:"Cyclops",role:"dps",released:!0,icon:!0},{id:"devil-dinosaur",name:"Devil Dinosaur",role:"tank",released:!0,icon:!0},{id:"black-cat",name:"Black Cat",role:"dps",released:!0,icon:!0},{id:"white-fox",name:"White Fox",role:"heal",released:!0,icon:!0},{id:"elsa-bloodstone",name:"Elsa Bloodstone",role:"dps",released:!0,icon:!0},{id:"deadpool",name:"Deadpool",role:"",released:!0,icon:!0},{id:"rogue",name:"Rogue",role:"tank",released:!0,icon:!0},{id:"gambit",name:"Gambit",role:"heal",released:!0,icon:!0},{id:"daredevil",name:"Daredevil",role:"dps",released:!0,icon:!0},{id:"angela",name:"Angela",role:"tank",released:!0,icon:!0},{id:"blade",name:"Blade",role:"dps",released:!0,icon:!0},{id:"phoenix",name:"Phoenix",role:"dps",released:!0,icon:!0},{id:"ultron",name:"Ultron",role:"heal",released:!0,icon:!0},{id:"emma-frost",name:"Emma Frost",role:"tank",released:!0,icon:!0},{id:"the-thing",name:"The Thing",role:"tank",released:!0,icon:!0},{id:"human-torch",name:"Human Torch",role:"dps",released:!0,icon:!0},{id:"invisible-woman",name:"Invisible Woman",role:"heal",released:!0,icon:!0},{id:"mister-fantastic",name:"Mister Fantastic",role:"dps",released:!0,icon:!0},{id:"squirrel-girl",name:"Squirrel Girl",role:"dps",released:!0,icon:!0},{id:"black-widow",name:"Black Widow",role:"dps",released:!0,icon:!0},{id:"wolverine",name:"Wolverine",role:"dps",released:!0,icon:!0},{id:"cloak-dagger",name:"Cloak&Dagger",role:"heal",released:!0,icon:!0},{id:"iron-fist",name:"Iron Fist",role:"dps",released:!0,icon:!0},{id:"psylocke",name:"Psylocke",role:"dps",released:!0,icon:!0},{id:"hawkeye",name:"Hawkeye",role:"dps",released:!0,icon:!0},{id:"iron-man",name:"Iron Man",role:"dps",released:!0,icon:!0},{id:"namor",name:"Namor",role:"dps",released:!0,icon:!0},{id:"moon-knight",name:"Moon Knight",role:"dps",released:!0,icon:!0},{id:"star-lord",name:"Star-Lord",role:"dps",released:!0,icon:!0},{id:"scarlet-witch",name:"Scarlet Witch",role:"dps",released:!0,icon:!0},{id:"winter-soldier",name:"Winter Soldier",role:"dps",released:!0,icon:!0},{id:"magik",name:"Magik",role:"dps",released:!0,icon:!0},{id:"spider-man",name:"Spider-Man",role:"dps",released:!0,icon:!0},{id:"black-panther",name:"Black Panther",role:"dps",released:!0,icon:!0},{id:"hela",name:"Hela",role:"dps",released:!0,icon:!0},{id:"storm",name:"Storm",role:"dps",released:!0,icon:!0},{id:"hulk",name:"Hulk",role:"tank",released:!0,icon:!0},{id:"jeff-the-land-shark",name:"Jeff The Land Shark",role:"heal",released:!0,icon:!0},{id:"the-punisher",name:"The Punisher",role:"dps",released:!0,icon:!0},{id:"luna-snow",name:"Luna Snow",role:"heal",released:!0,icon:!0},{id:"adam-warlock",name:"Adam Warlock",role:"heal",released:!0,icon:!0},{id:"rocket-raccoon",name:"Rocket Raccoon",role:"heal",released:!0,icon:!0},{id:"loki",name:"Loki",role:"heal",released:!0,icon:!0},{id:"mantis",name:"Mantis",role:"heal",released:!0,icon:!0},{id:"peni-parker",name:"Peni Parker",role:"tank",released:!0,icon:!0},{id:"thor",name:"Thor",role:"tank",released:!0,icon:!0},{id:"magneto",name:"Magneto",role:"tank",released:!0,icon:!0},{id:"venom",name:"Venom",role:"tank",released:!0,icon:!0},{id:"groot",name:"Groot",role:"tank",released:!0,icon:!0},{id:"captain-america",name:"Captain America",role:"tank",released:!0,icon:!0},{id:"doctor-strange",name:"Doctor Strange",role:"tank",released:!0,icon:!0},{id:"the-hood",name:"The Hood",role:"",released:!1}],edges:[{a:"the-hood",b:"jubilee",ability:"Hellfire Sparks",desc:"When Attack Speed is enhanced, Energy Plasmoids transform into a hitscan attack that grants self-healing on hit and is capable of dealing critical hits. Enhanced Effect: When teaming up with The Hood, the Void Magic Mark is never cleared, allowing her to indefinitely sustain the hitscan attack form"},{a:"blade",b:"jubilee",ability:"Vampiric Kin",desc:"Deploy a Vampiric Field. Allies standing within the field gain Life Steal when attacking enemies. Enhanced Effect: When teaming up with Blade, allies inside the field receive an additional Continuous Healing effect"},{a:"phoenix",b:"cyclops",ability:"Slim And Red",desc:"Hitting an enemy with Ricochet Force summons the Phoenix Force to ignite them, causing continuous burn damage over a set duration. Hitting an ignited target with Optic Blast or Concussive Beam instantly triggers a percentage of the remaining burn damage as a single burst. Enhanced Effect: When teaming up with Phoenix, Spark detonations reduce the cooldown of Ricochet Force"},{a:"gambit",b:"cyclops",ability:"Kinetic Kin",desc:"Release stored kinetic energy to enter an enhanced state for a duration. While active, Cyclops gains significantly increased movement speed and jump height. Enhanced Effect: When teaming up with Gambit, during the enhanced state, the attack speeds for both Optic Blast and Concussive Beam are increased"},{a:"the-punisher",b:"devil-dinosaur",ability:"Primal Punishment",desc:"Adds a new ability. Upon activation, Primal Bite is replaced. Devil Dinosaur gains 2 magnetic cannons that can be fired forward; the cannonballs detonate when hitting enemies or the environment. Enhanced Effect: When teaming up with The Punisher, the duo can request an interaction. Once accepted, The Punisher rides atop Devil Dinosaur, restricting him to only Adjudication/Deliverance and Scourge Grenade while disabling other abilities. While mounted, The Punisher gains Damage Reduction; Devil Dinosaur absorbs a portion of all damage inflicted on The Punisher"},{a:"jeff-the-land-shark",b:"devil-dinosaur",ability:"Surf & Turf",desc:"Impact Beam is replaced by a frontal water spray. This stream damages enemies while providing healing to teammates. Enhanced Effect: When teaming up with Jeff the Land Shark, Jeff can ride atop Devil Dinosaur's head. While riding, both gain some Damage Reduction and are swirled in therapeutic waters, receiving Continuous Healing. Jeff can only cast Joyful Splash, Aqua Burst, and Healing Bubble during this time"},{a:"black-panther",b:"black-cat",ability:"Feline Alliance",desc:"Taking damage accumulates Vibranium Energy. Upon reaching a specific threshold, Black Cat can unleash a violent explosion, damaging and Knocking back surrounding enemies while gaining a brief Speed Boost and Bonus Health. Enhanced Effect: When teaming up with Black Panther, this explosion is no longer restricted by the energy threshold and can be triggered at any time"},{a:"spider-man",b:"black-cat",ability:"Binding Ties",desc:"Turn of Fortune is replaced by Spider-Web Grapple, which has 2 charges. Landing the grapple on an enemy steals Fortune and applies a Spider-Tracer. If Black Cat hits an enemy carrying a Spider-Tracer with any other ability, she triggers the mark to deal bonus damage. Enhanced Effect: When teaming up with Spider-Man, using Spider-Web Grapple to hit an enemy already marked with a Spider-Tracer temporarily Immobilizes them in place"},{a:"black-cat",b:"white-fox",ability:"Lucky Loan",desc:"White Fox receives an Orb of Life from Black Cat. Upon use, it recovers Spirit Tail energy and converts life energy into Nine-Tailed Aura that shoots out in all directions. This automatically tracks nearby allies and enemies, granting Speed and Healing to allies while damaging and Slowing enemies. nhanced Effect: When teaming up with Black Cat, using the Orb triggers a state where Spirit Tail Energy is no longer consumed for a duration, allowing free use of Spectral Surge and Fox Form Awakening"},{a:"psylocke",b:"white-fox",ability:"Psionic Fox",desc:"Activating Fox Form Awakening no longer consumes Spirit Tail energy, and grants the maximum possible duration immediately upon use. Enhanced Effect: When teaming up with Psylocke, the cooldown for Fox Form Awakening is drastically reduced"},{a:"devil-dinosaur",b:"elsa-bloodstone",ability:"Prehistoric Trap",desc:"After deploying the Smoky Snare trap, Diablo will monitor the area. If enemies approach, Diablo Immobilizes and Damages them. He also releases a lethal gas, causing continuous area damage. Enhanced Effect: When teaming up with Devil Dinosaur, Elsa can store and deploy two Smoky Snares"},{a:"deadpool",b:"elsa-bloodstone",ability:"Loudmouth Mercs",desc:"Living Bullet changes to special rounds that Taunt targets with Deadpool's chatter, while Slowing, and damaging nearby enemies over time. After a timer, the bullet auto-recalls, healing Elsa based on the damage dealt while adding one extra gauge block to her Inherited Instinct passive cap. Enhanced Effect: When teaming up with Deadpool, Deadpool breaks the fourth wall, significantly boosting Instinct acquisition rate"},{a:"hela",b:"deadpool",ability:"Gumbo Chimichangas",desc:"Activate for kinetic energy, propelling Deadpool in a forward leap. Upon landing, he scatters a ring of kinetically charged chimichangas that deal damage to enemies. Enhanced Effect: When teaming up with Gambit, the kinetic energy causes Deadpool's landing to inflict a Stun effect on enemies in the blast radius"},{a:"gambit",b:"deadpool",ability:"Deadpool team-up",desc:""},{a:"gambit",b:"rogue",ability:"Mr. & Mrs. X",desc:'After activation, every attack triggers a kinetic explosion, dealing area damage to surrounding enemies while simultaneously healing nearby allies. Enhanced Effect: When teaming up with Gambit, Rogue remains permanently locked in the "Hearts as One" state'},{a:"magneto",b:"rogue",ability:"Explosive Entanglement",desc:"Defensive Stance is fortified. Activating the ability expands a magnetic field, drastically boosting the Damage Reduction ratio of Defensive Stance. Furthermore, all damage absorbed by the field is converted directly into damage for Southern Brawl. Enhanced Effect: When teaming up with Magneto, Southern Brawl Knocks back enemies. Extra damage is dealt if they're propelled into a wall"},{a:"magneto",b:"gambit",ability:"Favorable Odds",desc:"Throw two magnetic playing cards forward. Upon hitting the environment or a character, the two cards magnetically repel and unfurl, spinning in place for a duration. They heal allies they hit, while damaging and Launchingenemies. Enhanced Effect: When teaming up with Magneto, after the duration ends, the magnetic poles of the two cards reverse. They violently slam back together and explode, providing an extra burst of healing to allies and damage to enemies"},{a:"jubilee",b:"gambit",ability:"Sparkling Staff",desc:"Twirl your firework-energy enhanced bo staff. The radiating firework sparks provide healing to nearby allies. Concurrently, the staff deals damage to close-range enemies, and the rapid spinning blocks incoming damage from most projectiles. Enhanced Effect: When teaming up with Jubilee, both Bayou Bashand Big Easy Impactgain an additional Continuous Healingaura"},{a:"iron-fist",b:"daredevil",ability:"Comprehensive Defense",desc:"Objection! is enhanced. Whirling billy clubs now damage all enemies in range while deflecting Projectiles from all directions. Successfully deflecting attacks recovers Fury. Enhanced Effect: When teaming up with Iron Fist, Daredevil passively recovers Health for the entire duration of the ability"},{a:"black-widow",b:"daredevil",ability:"Devilish Affair",desc:"Swings Devil's Chain in a criss-cross pattern, dealing damage to enemies in front and inflicting a Slow. Enhanced Effect: When teaming up with Black Widow, the damage radius is expanded, and landing hits recovers Fury"},{a:"star-lord",b:"angela",ability:"Asgardians Of The Galaxy",desc:"Activation grants Reveal within a targeted area. Activating the ability again performs a slam attack; enemies hit by the slam are Grounded. Enhanced Effect: When teaming up with Star-Lord, Angela gains Bonus Health scaling with the number of enemies struck by the slam"},{a:"loki",b:"angela",ability:"Odin's Unacknowledged",desc:"Project an Illusion forward. The illusion utilizes Assassin's Charge to thrust at enemies. Enemies struck head-on will be carried through the air for a short while. Enhanced Effect: When teaming up with Loki, the ability gains two charges"},{a:"moon-knight",b:"blade",ability:"Blade Of Khonshu",desc:"Perform a heavy forward cleave with the Ancestral Sword while performing a short dash. At the end of the dash, swiftly slash four times, each strike sending a Darkmoon Blade forward. When a Darkmoon Blade hits an enemy, it bounces to nearby targets. Enhanced Effect: When teaming up with Moon Knight, each Whirlwind Slash triggered generates one additional Darkmoon Blade"},{a:"captain-america",b:"blade",ability:"Bleed For Battle",desc:"For every set amount of damage taken, Blade builds a stack of Bloodline Awakening. Enhanced Effect: When teaming up with Captain America, taking critical damage instantly triggers the Bloodline Awakening state, gaining bonus stacks while raising the overall stack cap"},{a:"hela",b:"phoenix",ability:"Circle Of Life",desc:"Psionic Detonation is replaced by Phoenix Netherfire, applying a Telekinetic Mark to the targeted location. Upon hitting, it triggers an initial small explosion that briefly Stuns enemies, followed by two larger explosions that apply a Healing Reduction effect. Every single blast inflicts Sparks onto the enemies. Enhanced Effect: When teaming up with Hela, every blast in the sequence applies multiple stacks of Sparks to enemies caught within"},{a:"rogue",b:"phoenix",ability:"Telekinetic Beatdown",desc:"Fire a telekinetic shockwave forward. If it lands, the Phoenix Force rushes the enemy and delivers a powerful punch. If there are other targets nearby, the Phoenix Force rapidly blinks between them to strike them as well, inflicting Sparks on each victim while healing Phoenix. Enhanced Effect: When teaming up with Rogue, the width of the telekinetic shockwave expands, and the Phoenix Force's target detection range is increased"},{a:"iron-man",b:"ultron",ability:"Stark Protocol",desc:"Upgrade Encephalo-Ray to Nano-Ray, firing multiple damaging nano-projectiles forward. Enhanced Effect:When teaming up with Iron Man, Imperative: Firewall fires powerful homing missiles at enemies in range, causing area damage"},{a:"peni-parker",b:"ultron",ability:"Ultron team-up",desc:""},{a:"mantis",b:"emma-frost",ability:"Spirit Breaker",desc:"Deals damage to the summoned Soul Crystal, which can be converted into Bonus Healthfor yourself. Enhanced Effect: When Emma Frost teams up with Mantis, shattering the Soul Crystalgrants a one-time Bonus Healthand reduces the cooldown of Mind Control"},{a:"luna-snow",b:"emma-frost",ability:"Iced Out Diamond",desc:"Emma Frost releases winter energy forward, dealing damage and Slowto enemies. She can also enhance her diamond form, condensing frost in front of her to form Zero Diamondthat blocks enemy attacks and movement. Enhanced Effect: When Emma Frost teams up with Luna Snow, after activating Diamond Form, all ability damage applies Slow, and Soul Wavealso applies Slow"},{a:"human-torch",b:"the-thing",ability:"Two In One",desc:"Enter an enhanced state upon activation. For the duration, The Thing's fists are violently engulfed in flames. Every Rocky Jab deals splash damage, and every Stone Haymaker creates an explosion, dealing damage in a frontal cone. Enhanced Effect: When teaming up with Human Torch, Human Torch can lift The Thing into the air and slam him down, dealing damage and Stun to enemies. The Thing then automatically enters his flaming enhanced state upon landing"},{a:"invisible-woman",b:"the-thing",ability:"Unbreakable Forces",desc:"Generate a layer of Psionic Armor upon activation, granting Bonus Health scaling off currently missing Health. Enhanced Effect: When teaming up Invisible Woman, the Psionic Armor is fortified. While active, every time The Thing takes a set amount of damage, the armor pulses out a wave of area healing for allies. Furthermore, the conversion ratio for missing Health into Bonus Health is increased"},{a:"jubilee",b:"human-torch",ability:"Fiery Sparks",desc:"Passively detect enemies in the immediate vicinity and launch tracking Sparks to chip away their health. Enhanced Effect: When teaming up with Jubilee, successfully landing a Firework Spark on an enemy grants Human Torch Bonus Health"},{a:"storm",b:"human-torch",ability:"Storming Ignition",desc:"Unleash a storm-driven blaze of fire forward, generating a persistent Fire Vortex upon impact that continuously damages and pulls in enemies. Enhanced Effect: When teaming up with Storm, her Omega Hurricane ignites into a Burning Hurricane if it crosses a Flame Tornado. Furthermore, any Omega Hurricane, Jeff-Nado, or Flame Tornado that sweeps across a Flame Field left by Human Torch will instantly generate a new Flame Tornado"},{a:"human-torch",b:"invisible-woman",ability:"United Siblings",desc:"Generate a Flame Shield for a targeted ally that blocks incoming damage while providing a Continuous Healing aura to everyone nearby. Projectiles from teammates shot through the Flame Shield receive a Damage Boost. Enemies that pass though the shield are Slowed Enhanced Effect: When teaming up with Human Torch, the Flame Shield boasts a larger radius and heavily increased shield value"},{a:"mister-fantastic",b:"invisible-woman",ability:"First Family",desc:"Invisible Woman and surrounding allies enter Invisible state, gaining healing and a Speed Boost. The effect ends if they take damage or the duration expires. Disengaging from combat for a duration will reenter the Invisible state. Enhanced Effect: When teaming up with Mister Fantastic, the healing and Speed Boost effects are enhanced, and the Invisible state duration is increased"},{a:"rocket-raccoon",b:"mister-fantastic",ability:"Fantastic Amplifier",desc:"Equips the Fantastic Amplifier. For the duration, Mister Fantastic's maximum Elasticity is increased, and he can actively enter Inflation State. Enhanced Effect: When teaming up with Rocket Raccoon, Brainiac Bounce Launches hit enemies"},{a:"the-thing",b:"mister-fantastic",ability:"Clobberin' Research Dept.",desc:"In brawler stance, Stretch Punch becomes a charged ability, firing a forward Brawling Punch. Hitting an enemy grants Bonus Health scaling with damage, and a full charge Launches hit enemies. Enhanced Effect: When teaming up with The Thing, while in the brawling stance, Distended Grip also becomes a charged ability, slamming down a Distended Hammer. Hitting enemies grants Bonus Health based on damage, and Launches enemies at full charge"},{a:"iron-man",b:"squirrel-girl",ability:"Squirrel Missile",desc:"Squirrel Girl gains the Squirrel Missile ability. She directs a squirrel to ride Iron Man's nanotech glove as a homing missile. Upon hit, the squirrel flees just before a fiery explosion. Enhanced Effect: When teaming up with Iron Man, using Squirrel Blockade simultaneously fires a Squirrel Missile"},{a:"spider-man",b:"squirrel-girl",ability:"Esu Alumnus",desc:"Spider-Man gives Squirrel Girl a web bomb. She can launch it to unleash an explosion upon contact with the environment or an enemy, briefly Slowing and damaging enemies caught in the blast. Enhanced Effect: When teaming up with Spider-Man, Squirrel Girl receives more Web Fluid. After throwing Webbed Acorn, viscous web fluid coats the ground alongside the explosion, leaving behind a sticky Web Area. Enemies within suffer a continuous Slow that scales into a Stun if they linger too long"},{a:"hawkeye",b:"black-widow",ability:"Allied Agents",desc:"Landing hits with Red Room Rifle builds Focus. At three stacks, enter a Focused state where the next bullet gains the Hunter's Sight effect, granting Damage Boost and pierce effects. Enhanced Effect: When teaming up with Hawkeye, landing a critical hit prevents the Focused state from expiring, allowing continuous enhanced fire until missing a crit"},{a:"phoenix",b:"black-widow",ability:"Burning Bullets",desc:"Activation grants the Red Room Rifle a Fire Rate Boost. Additionally, the Plasma Cannon projectile becomes a hitscan laser that no longer requires charging. Enhanced Effect: When teaming up with Phoenix, her Plasma Cannon gains a second ability charge"},{a:"cyclops",b:"wolverine",ability:"Blast Slash",desc:"Activation extends the attack range of Savage Claw and Berserk Claw Strike. Vicious Rampage is replaced with Kinetic Claws, granting a brief forward lunge that unleashes a flurry of slashes around. Enhanced Effect: When teaming up with Cyclops, Blast Slash is permanently active"},{a:"gambit",b:"wolverine",ability:"Pair Of Threes",desc:"Upon activation, Wolverine receives Kinetic Enhancement, gaining increased Movement Speed and a Jump Boost. Attacking enemies applies Kinetic Particles that detonate after a short delay for bonus damage. The effect lasts for duration. Enhanced Effect: When teaming up with Gambit, Wolverine receives Continuous Healing for the entire duration of the ability"},{a:"the-hood",b:"cloak-dagger",ability:"Oblivion Shroud",desc:"Veil of Lightforce and Terror Cape are warped by hellfire energy, changing into Veil of Light and Veil of Darkness while retaining their original effects. After traveling a set distance, the veils halt in place. Enemy damage passing through the Veil of Light is weakened, while enemy healing passing through the Veil of Darkness suffers Healing Reduction. Enhanced Effect: When teaming up with The Hood, the width of both the Veil of Light and Veil of Darkness expands. Additionally, allies passing through the veils are empowered by hellfire energy, gaining Damage Boost for a duration"},{a:"luna-snow",b:"cloak-dagger",ability:"Frozen Haven",desc:"Channel frost energy outward to encase yourself in an absolute block of ice. This offers great protection, but Freezes you in place. While frozen, you can be healed and emit a weak healing aura to nearby allies. Enhanced Effect: When teaming up with Luna Snow, the healing aura provided to allies while Frozen becomes significantly stronger"},{a:"the-thing",b:"iron-fist",ability:"Iron & Stone",desc:"Unleash a powerful uppercut to Launch Up enemies. Enhanced Effect: When teaming up The Thing, unleashing the uppercut can be chained directly into a sweeping leg sweep for a follow-up attack"},{a:"white-fox",b:"iron-fist",ability:"Kumiho Palm",desc:"Hitting an enemy with Yat Jee Chung Kuen provides a burst of healing to nearby allies. Enhanced Effect: When teaming up White Fox, the lock-on distance for Yat Jee Chung Kuen is significantly increased"},{a:"emma-frost",b:"psylocke",ability:"Mental Projection",desc:"Create an illusory projection that automatically dashes forward to use Psi-Blade Dash, while Psylocke enters Stealth. If Psylocke attacks, the illusion mimics her strikes. Enhanced Effect: When teaming up with Emma Frost, Psylocke's mental powers are elevated, allowing her to reactivate the ability to instantly swap places with her illusion"},{a:"cloak-dagger",b:"psylocke",ability:"Light & Dark Darts",desc:"Unleash a ring of Light Darts in all directions that damage enemies and restore Psylocke's Health upon impact, leaving behind a Shadow Domain. Staying inside the domain for a short time will re-enter Stealth. Enhanced Effect: When teaming up with Cloak & Dagger, the radius of the Shadow Domain expands, and each time re-entering Stealth, the Light Darts are fired in all directions again"},{a:"psylocke",b:"hawkeye",ability:"Senbonzakura Strike",desc:"Upgrade Blast Arrow to Psionic Arrow. While drawn, Hawkeye can continuously bank extra Psionic Arrows. Releasing the bowstring rapidly fires all accumulated arrows forward in sequence. Enhanced Effect: When teaming up with Psylocke, the nocking speed for each Psionic Arrow is significantly quickened, and they explode upon hitting enemies or the environment"},{a:"cloak-dagger",b:"hawkeye",ability:"Moonlit Slash",desc:"Upgrade Crescent Slash to Moonlit Slash, projecting a radiant slash outward. It heals and boosts healing for allies, while damaging enemies and applying Vulnerability. Enhanced Effect: When teaming up with Cloak & Dagger, Moonlit Slash can be chained into a three-hit combo, firing off three consecutive sweeping light blades"},{a:"hulk",b:"iron-man",ability:"Gamma Charge",desc:"Upgrade Armor Overdrive to Gamma Overdrive. In this state, Iron Man gains a Gamma Shield and can fire significantly stronger Repulsor Blasts and Unibeams. Enhanced Effect: When teaming up with Hulk, releasing Invincible Invincible Pulse Cannon generates a Gamma Shield and heavily infuses the blast, creating a Gamma Pulse Cannon. Its radiation creates a massive damage increase while the projectile flies"},{a:"thor",b:"iron-man",ability:"Thunder Overdrive",desc:"Enhance Unibeam both in and out of Armor Overdrive. When fired, a ring of volatile lightning energy forms, dealing bonus damage to enemies caught near the beam's edge. Enhanced Effect: When teaming up with Thor, Armor Overdrive cooldown is massively reduced"},{a:"hulk",b:"namor",ability:"Gamma Monstro",desc:"Summon an extra Gamma Monstro that continuously damages the nearest enemy. Upon landing critical hits, the Gamma Monstro gains increased Attack Speed. Hitting an enemy with Wrath of the Seven Seas prompts it to fire a powerful beam. Enhanced Effect: When teaming up with Hulk, casting Blessing of the Deep creates a water barrier infused with Gamma energy. Standing inside accelerates the Gamma Monstro cooldown and grants it a Damage Boost"},{a:"luna-snow",b:"namor",ability:"Chilling Charisma",desc:"Gain a new ability to summon a Frost Tide forward. The wave damages, Pushes Back, and inflicts a Slow on all enemies hit. Enhanced Effect: When teaming up with Luna Snow, the Frost Tide gains 1 charge and crashes down upon reaching its maximum range, dealing area damage and Slowing enemies caught near the endpoint"},{a:"cloak-dagger",b:"moon-knight",ability:"Luminous Moon",desc:"Enter Phased state and dash forward. Upon concluding, emit a Light Energy Healing Wave that heals Moon Knight and nearby allies. Enhanced Effect: When teaming up with Cloak & Dagger, the Phased state duration is extended, the dash distance increases, and the Light Energy Healing Wave boasts a larger radius and stronger healing output"},{a:"elsa-bloodstone",b:"moon-knight",ability:"Blood Moon",desc:"Deploy an Ankh Trap. Upon triggering, an Ankh materializes at the location, while summoning a single Talon of Khonshu to Launch enemies toward the trap's center. Enhanced Effect: When teaming up with Elsa Bloodstone, triggering the trap summons multiple Talons of Khonshu to bombard the area"},{a:"groot",b:"star-lord",ability:"Star-soul",desc:"Gain a new ability to place a Telekinetic Beacon. You can teleport back to the location where the beacon is deployed from anywhere on the map. Upon defeat, Star-Lord will cocoon and respawn at the Telekinetic Beacon's coordinates. Enhanced Effect: When teaming up with Adam Warlock, every time Star-Lord participates in a KO, Telekinetic Beaconcooldown is reduced"},{a:"adam-warlock",b:"star-lord",ability:"Star-Lord team-up",desc:""},{a:"doctor-strange",b:"scarlet-witch",ability:"Sorcerers Supreme",desc:"Chthonian Burst is replaced with Mystic Burst upon activation. Hold down the attack button to unleash a rapid, relentless salvo of magical missiles in the target direction. Enhanced Effect: When teaming up with Doctor Strange, Scarlet Witch's maximum total Chaos Energy pool increases, and Chaos Control generates energy much faster when attacking"},{a:"jubilee",b:"scarlet-witch",ability:"Hex Fireworks",desc:"Infuse firework energy into the Dark Seal forcefield, turning it into a Plasmoid Seal, allowing for a secondary blast. After expanding the Plasmoid Seal, pressing the {Ability1} key again while it persists will detonate the fireworks, dealing damage and inflicting Vulnerability. Enhanced Effect: When teaming up with Jubilee, Scarlet Witch receives constant healing from the firework energy while using Mystic Projection"},{a:"the-punisher",b:"winter-soldier",ability:"Timeless Veterans",desc:"Unlocks the Burst Spike ability. Using the bionic arm emits forward electricity, dealing damage and Knocking Back enemies. Enhanced Effect: When teaming up with The Punisher, the electric burst applies a Grounded effect and Knocks Back enemies even further"},{a:"elsa-bloodstone",b:"winter-soldier",ability:"Expert Instinct",desc:"Securing or participating in a KO grants a stack of Culling Instinct. Each stack reduces the cooldowns of Winter Soldier's other abilities. All stacks are lost upon defeat. Enhanced Effect: When teaming up with Elsa Bloodstone, the Bonus Health generated by Ceaseless Charge is increased"},{a:"doctor-strange",b:"magik",ability:"Chain Of Cyttorak",desc:"Chain of Cyttorak can tether two enemies simultaneously, dragging both targets to the same location. Enhanced Effect: When teaming up with Doctor Strange, Chain of Cyttorak can tether multiple enemies at once, pulling the entire group to a singular point"},{a:"the-hood",b:"magik",ability:"Void Pentagram",desc:"Casting Stepping Discs within an Hellish Magic Circle refunds energy, and each use of Stepping Discs summons a Limbo Demon. Enhanced Effect: When teaming up with The Hood, the summoned Limbo Demons have heavily increased Health and a wider attack range"},{a:"venom",b:"spider-man",ability:"Symbiote Bond",desc:"Venom shares a part of his symbiote with Spider-Man, activating their symbiote abilities. Spider-Man can convert the symbiotes into explosive spikes that inflict harm on nearby enemies and relentlessly drive them back. Enhanced Effect: When teaming up with Venom, this triggers additional Touch of Klyntar tendrils that continuously tether and damage enemies on top of the base effect"},{a:"peni-parker",b:"spider-man",ability:"Parker Power-up",desc:"Peni Parker whips up a Sticky Spider-Bomb for Spider-Man! Prime it, then toss it before the timer's up for a blast that damages nearby enemies and attaches a Spider-Tracer to them. If not thrown in time, it explodes on Spider-Man, recharging all Web-Cluster shots. Enhanced Effect: When teaming up with Peni Parker, Spider-Tracers applied by Web-Cluster are upgraded. Detonating these upgraded marks generates <Buff>Bonus Health for Spider-Man"},{a:"storm",b:"black-panther",ability:"Damisa-yao",desc:"Triggers the elemental power within his armor, dealing damage and applying Slow to surrounding enemies while attaching Vibranium Marks. Enhanced Effect: When teaming up with Storm, enemies within range are launched toward Black Panther"},{a:"magik",b:"black-panther",ability:"Dimensional Shortcut",desc:"Activate a Limbo stepping disc to instantly return to your position from a few seconds ago, gaining Bonus Health in the process. When the teleport ends, the disc collapses in an explosion, damaging nearby enemies and applying Vibranium Marks. Enhanced Effect: When teaming up with Magik, the teleportation sequence can be manually canceled mid-transit"},{a:"venom",b:"hela",ability:"Hel Tendrils",desc:"Replace Soul Drainer with Hel Tendrils. Upon hit, tendrils pull nearby enemies toward the impact point and links them, Slowingenemies that try to escape. Enhanced Effect: When teaming up with Venom, Piercing Night fires a dense volley of symbiote-infused Nightsword Thorns. Each direct Nightsword Thorn hit restores a portion of Hela's Health"},{a:"namor",b:"hela",ability:"Deep Wrath",desc:"Whenever Hela participates in a KO, an Undead Monstro spawns at the fallen enemy's position. While an Undead Monstro is present, casting Piercing Night will command the Monstro to spit a Nightsword Thorn at the nearest enemy. Enhanced Effect: When teaming up with Namor, each attack during Goddess of Death spawns an Undead Monstro at the point of impact. Undead Monstro Health 150 Undead Monstro Damage 15 per round Damage Falloff Falloff begins at 20m, decreasing to 50% at 40m Attack Speed 0.33s per round 1 4 DEEP WRATH Base Effect: Whenever Hela participates in a KO, an Undead Monstro spawns a"},{a:"thor",b:"storm",ability:"God Of Thunder",desc:"Upgrade Wind Blade into a hitscan beam that detonates upon striking a target. Enhanced Effect: When teaming up with Thor, Bolt Rush becomes Chain Lightning, allowing it to bounce from foe to foe"},{a:"jeff-the-land-shark",b:"storm",ability:"Jaws Of Fate",desc:"Unleash a torrential downpour that continuously heals both herself and her teammates. Enhanced Effect: When teaming up with Jeff the Land Shark, casting Omega Hurricane allows Jeff to swim inside the cyclone, generating a localized Jeff-nado"},{a:"captain-america",b:"hulk",ability:"Savage Slam",desc:"Leap high and smash the ground, dealing damage to enemies and reducing the cooldowns of other abilities based on remaining Health. Enhanced Effect: When teaming up with Captain America, the ground slam additionally applies Vulnerability to enemies hit"},{a:"wolverine",b:"hulk",ability:"Gamma Fastball",desc:"Enter a Furious state upon activation, gaining Speed Boost and Attack Speed for a duration. Also unlocks the Dances With Werewolves ability, granting Unstoppable for a period when Health drops to a certain threshold. Enhanced Effect: When teaming up with Wolverine, unlocks the Fastball Special. Upon mutual confirmation, Hulk hurls Wolverine forward"},{a:"venom",b:"jeff-the-land-shark",ability:"Guardian Of The Deep",desc:"Shoot out healing tendrils; linked allies receive Continuous Healing, and excess healing is converted into Bonus Health. Enhanced Effect: When teaming up with Venom, symbiote tendrils can also lash out at nearby enemies within range, inflicting continuous damage"},{a:"deadpool",b:"jeff-the-land-shark",ability:"Mr. Pool's Interdimensional Toy Box",desc:"Gain a new ability to spit out a Deadpool Plushie. The plushie continuously Taunts nearby enemies while spraying a healing mist onto surrounding allies. Enhanced Effect: When teaming up with Deadpool, the Deadpool Plushie asserts a much stronger Taunt while concurrently damaging enemies caught in its radius"},{a:"daredevil",b:"the-punisher",ability:"Bestial Hunt",desc:"Shoot piercing bullets that carry a Damage Boost effect. Enhanced Effect: When teaming up with Daredevil, the bullets break enemy summoned walls and shields more quickly"},{a:"rocket-raccoon",b:"the-punisher",ability:"Ammo Overload",desc:"Throw an Ammo Overload Device in the target direction. Upon entering the device's range, receive Faster Firing. Enhanced Effect: When teaming up with Rocket Raccoon, the device grants Infinite Ammo"},{a:"white-fox",b:"luna-snow",ability:"Atlas Bond",desc:"Unleash a spirit fox forward that Charms enemies while healing any allies in its path. Activating the ability instantly cleanses all negative status effects on Luna Snow. Enhanced Effect: When teaming up with White Fox, the spirit fox automatically returns after reaching its maximum distance, and the self-cleanse is retained. Cooldown 12s Healing Amount 70 Charm Duration 0.35s Flight Speed 60 m/s Maximum Flight Distance 40m Damage 35 Damage Radius 3m Charm Radius 0.8m 0 4 ATLAS BOND Base Effect: Unleash a spirit fox forward that Charms enemies while healing any allies in its path. Activating"},{a:"adam-warlock",b:"luna-snow",ability:"Duality Dance",desc:"Cast Soul Bond to tether all characters within range. Attacking tethered enemies or healing linked allies restores your Health. Enhanced Effect: When teaming up with Adam Warlock, scoring critical hits with Light & Dark Ice reduces the cooldowns of Absolute Zero and Ice Arts. Cooldown 15s Ability Duration 6s Chain Cast Detection Range 20m radius Max Chain Distance 25m Damage Dealt to Self-Healing Ratio 50% Ally Healing to Self-Healing Ratio 25% 1 4 DUALITY DANCE Base Effect: Cast Soul Bond to tether all characters within range. Attacking tethered enemies or healing linked allies restores your"},{a:"storm",b:"adam-warlock",ability:"Cosmic Cyclone",desc:"Teammates linked by {a:"star-lord",b:"mantis",ability:"Star Blossom",desc:"Recasting Healing Flower on a teammate with the effect enhances and spreads the healing aura. Enhanced Effect: When teaming up with Star-Lord, using Healing Flower on any teammate instantly triggers the enhanced Spell Field and healing effect"},{a:"adam-warlock",b:"mantis",ability:"Vitality Pact",desc:"Upon defeat, Mantis can freely move as a soul, healing nearby allies, and reforge her body at a chosen spot. After using Natural Anger, the effect of Nature's Favor is enhanced, increasing the amount of healing provided. Enhanced Effect: When teaming up with Adam Warlock, her soul state can forge Soul Bond with nearby teammates, granting Healing Over Timeand distributing damage taken across the bond"},{a:"black-panther",b:"peni-parker",ability:"Vibranium Mech",desc:"Upon activation, briefly grants Cyber-Web Clusteran Attack Speedand DamageBoost. Enhanced Effect: When teaming up with Black Panther, activating the ability deploys a frontal Vibranium Shield, while reducing the Vibranium Energy cost of Cyber-Web Cluster"},{a:"rocket-raccoon",b:"peni-parker",ability:"Rocket Network",desc:"Deploy an Armored Spider-Nestthat periodically drops Spider-Dronesand Armor Packsthat grant Bonus Health. Enhanced Effect: When teaming up with Rocket Raccoon, the Armored Spider-Nestpassively regenerates its own Health. Furthermore, Rocket's B.R.B.will generate Cyber-Webs, and spawn both Spider-Dronesand Arachno-Mines"},{a:"hela",b:"thor",ability:"Ragnarok Rebirth",desc:"Receiving fatal damage prevents immediate defeat, Thor gains a decaying pool of Bonus Health. If he participates in a KO during this time, he resurrects and recovers a small amount of Health. Enhanced Effect: When teaming up with Hela, if either of them participates in a KO, Thor instantly revives, restoring Health equal to his remaining Bonus Health and gaining a Continuous Healing effect"},{a:"angela",b:"thor",ability:"Divine Armory",desc:"Hurl a Thunder Spear that restores Thorforce for each enemy struck. Afterward, Thor canleap to the spear's explosion point, dealing a second wave of damage to all enemies within range. Enhanced Effect: When teaming up with Angela, leaping to the Thunder Spear grants Bonus Health"},{a:"scarlet-witch",b:"magneto",ability:"Metallic Chaos",desc:"Summons a Chaos Greatsword that deals damage to enemies in front. Enhanced Effect: When teaming up with Scarlet Witch, Magnetic Cannon becomes a charged ability. Charging consumes passive energy, and each energy segment consumed fires a Chaos Greatsword that deals damage to enemies"},{a:"emma-frost",b:"magneto",ability:"Magnetic Resonance",desc:"Cast a magnetic projection that mimics Magneto's movement and ability casts perfectly from the enemy's perspective. Enhanced Effect: When teaming up with Emma Frost, the magnetic projection receives a massive Health bump and will persist indefinitely unless destroyed or manually recalled"},{a:"blade",b:"venom",ability:"Blood Leech",desc:"Cellular Corrosion new effect: while tethered to enemies, continuously siphon health from every linked target, restoring Venom's Health. Enhanced Effect: When teaming up with Blade, Venom gains a burst of one-time healing when using certain specific abilities"},{a:"phoenix",b:"venom",ability:"Abyssal Flames",desc:"Ignites the symbiote with Phoenix Flames for a duration, replacing Dark Predation with a sweeping Phoenix Touch frontal slash. Enhanced Effect: When teaming up with Phoenix, Venom's Phoenix Force is enhanced: every Phoenix Touch applies Sparks. Upon reaching three stacks, the Sparks detonate"},{a:"mantis",b:"groot",ability:"Wild Wall",desc:"Summon a Wild Wall that provides Continuous Healing and Bonus Health to allies within its range. Enhanced Effect: When teaming up with Mantis, the Wild Wall evolves after providing a certain amount of healing, increasing its healing"},{a:"jeff-the-land-shark",b:"groot",ability:"Bubble Buddies",desc:"Retreat inside a Bubble Shield to enter an Invincible state, granting self-targeted Continuous Healing. Enhanced Effect: When teaming up with Jeff the Land Shark, the healing effect inside the bubble is enhanced, and any excess healing converts into Bonus Health"},{a:"winter-soldier",b:"captain-america",ability:"Stars Aligned",desc:"Captain America can leap directly to a teammate, providing Bonus Health to both himself and the ally, while redirecting a portion of their incoming damage to himself. Enhanced Effect: When teaming up with Winter Soldier, the duo can trigger a mutual rally. Upon confirmation, they charge at one another, slamming together to grant Bonus Health and Movement Speed to all nearby friends. The original effect remains, now additionally granting a Speed Boost to the targeted teammate"},{a:"thor",b:"captain-america",ability:"Voltaic Union",desc:"Modifies Sentinel Strike into a Lightning Shield projectile. After landing two hits, Captain America launches the piercing Lightning Shield four times. Enhanced Effect: When teaming up with Thor, the lightning energy imbued in the shield intensifies. Each hit from the Lightning Shield triggers an extra burst of damage in the surrounding area"},{a:"hulk",b:"doctor-strange",ability:"Gamma Maelstrom",desc:"Upgrade Maelstrom of Madness to Gamma Maelstrom. This drastically boosts energy charge rates and removes the Anti-Heal curse. Enhanced Effect: When teaming up with Hulk, releasing Gamma Maelstrom retains some energy, and stored Gamma energy doesn't decay over time"},{a:"invisible-woman",b:"doctor-strange",ability:"Psionic Vortex",desc:"Upgrade Maelstrom of Madness to Psionic Vortex. Enemies caught in are Launched toward you. Shield of the Seraphim also gains increased shield value. Enhanced Effect: When teaming up with Invisible Woman, any damage dealt by Psionic Vortex provides proportional Bonus Health for Doctor Strange"}],version:"scraped",generated:"2026-07-13T17:26:45+00:00"},byId=new Map(DATA.heroes.map(e=>[e.id,e])),outEdges=new Ma
